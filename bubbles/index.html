<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股泡泡圖 v7.3 - GitHub Actions 真數據版</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0a0e1a;color:#e5e5e5;font-family:ui-monospace,Menlo,monospace}.bubble{position:absolute;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;cursor:pointer;transition:transform .18s;user-select:none}.bubble:hover{transform:scale(1.08);z-index:10}</style>
</head>
<body>
<div class="max-w-[1280px] mx-auto p-3">
  <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
    <h1 class="text-[16px] font-bold">台股泡泡圖 v7.3 - 真數據最終版 <span class="text-[10px] text-zinc-500">GitHub Actions 自動更新</span></h1>
    <div class="flex items-center gap-2">
      <span id="sourceBadge" class="px-2 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-[10px]">來源: bubbles/twse_data.json</span>
      <span id="proxyBadge" class="px-2 py-1 rounded-full bg-emerald-950 border border-emerald-800 text-[10px] text-emerald-300">本地 JSON 無 CORS</span>
      <span id="timeBadge" class="px-2 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-[10px]">--</span>
      <button id="refreshBtn" class="px-3 py-1 rounded bg-white text-black text-[11px] font-bold">重新讀取</button>
    </div>
  </div>
  <div id="statusLine" class="text-[11px] mb-2 px-2 py-1 rounded bg-zinc-900 border border-zinc-800">初始化...</div>
  <div class="grid grid-cols-12 gap-3">
    <div class="col-span-3 bg-zinc-900/60 border border-zinc-800 rounded-xl p-3">
      <div class="text-[12px] font-bold mb-2">即時分類 (真實漲跌)</div>
      <div id="laneList"></div>
      <div class="mt-3 text-[10px] text-zinc-500">未開盤/缺失</div>
      <div id="missingList" class="text-[11px] space-y-1 max-h-[30vh] overflow-auto"></div>
      <div class="mt-3 text-[10px] text-zinc-600">V7.3: GitHub Actions 每5分鐘抓 TWSE，寫入 bubbles/twse_data.json，頁面讀本地JSON，無CORS問題，(z-y)/y 自我檢核</div>
    </div>
    <div class="col-span-9">
      <div id="bubbleContainer" class="relative w-full h-[68vh] bg-[#11131a] border border-zinc-800 rounded-xl overflow-hidden"></div>
      <div class="grid grid-cols-3 gap-2 mt-2">
        <div class="bg-zinc-900/60 border border-zinc-800 rounded p-2 flex justify-between"><span class="text-[11px] text-zinc-500">數據檢核</span><span id="verifyCount" class="text-[12px] font-bold">--</span></div>
        <div class="bg-zinc-900/60 border border-zinc-800 rounded p-2 flex justify-between"><span class="text-[11px] text-zinc-500">更新時間</span><span id="updateTime" class="text-[11px]">--</span></div>
        <div class="bg-zinc-900/60 border border-zinc-800 rounded p-2 flex justify-between"><span class="text-[11px] text-zinc-500">2330 驗證</span><span id="t2330Info" class="text-[10px] truncate">--</span></div>
      </div>
    </div>
  </div>
</div>
<script>
const CORE=["2330","2317","2454","2308","2881","2882","2303","2603","1301","1303","2412","2886","2891","2002","1216","2884","2885","2892","2382","2357","1101","1326","6505","2207","3008","3034","3037","3045","3711","2301"];
let stocks=CORE.map(c=>({code:c,name:"",price:0,prev:0,pct:0,verified:false,raw:null,w:30}));
async function load(){
  document.getElementById('statusLine').textContent='讀取本地 bubbles/twse_data.json (GitHub Actions 產生，無CORS)...';
  try{
    const res=await fetch('./twse_data.json?_='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status+' 找不到 twse_data.json，請先跑一次 GitHub Actions workflow');
    const data=await res.json();
    document.getElementById('timeBadge').textContent=data.updatedAt_TW || data.updatedAt;
    document.getElementById('updateTime').textContent=data.updatedAt_TW;
    document.getElementById('statusLine').textContent=`✅ 真實數據已驗證 來源:${data.source} 筆數:${data.count} 更新:${data.updatedAt_TW} | (z-y)/y 自我檢核`;
    let success=0;
    (data.msgArray||[]).forEach(raw=>{
      const code=raw.c; const idx=stocks.findIndex(s=>s.code===code); if(idx<0) return;
      const z=raw.z==='-'?'':raw.z; const y=raw.y; const n=raw.n||'';
      if(z && y){ const price=parseFloat(z); const prev=parseFloat(y); if(!isNaN(price)&&!isNaN(prev)&&prev!==0){ const pct=((price-prev)/prev)*100; stocks[idx].price=price; stocks[idx].prev=prev; stocks[idx].pct=pct; stocks[idx].verified=true; stocks[idx].raw=raw; stocks[idx].name=n; success++; }}
    });
    document.getElementById('verifyCount').textContent=`${success}/30 成功`;
    const t2330=stocks.find(s=>s.code==='2330'); if(t2330&&t2330.verified) document.getElementById('t2330Info').textContent=`現價 ${t2330.price} vs 昨收 ${t2330.prev} = ${t2330.pct.toFixed(2)}% 吻合`;
    render();
  }catch(e){
    document.getElementById('statusLine').textContent=`⚠️ 讀取失敗: ${e.message} | 解決: 到 GitHub → Actions → Update TWSE Data → Run workflow 手動跑一次，產生 twse_data.json`;
    // fallback: try direct fetch for demo (will fail but show message)
    render();
  }
}
function render(){
  const c=document.getElementById('bubbleContainer'); c.querySelectorAll('.bubble').forEach(e=>e.remove());
  const lanes={strong:stocks.filter(s=>s.verified&&s.pct>1.5),stable:stocks.filter(s=>s.verified&&s.pct>0&&s.pct<=1.5),flat:stocks.filter(s=>s.verified&&Math.abs(s.pct)<0.05),weak:stocks.filter(s=>s.verified&&s.pct<0&&s.pct>=-1.5),panic:stocks.filter(s=>s.verified&&s.pct<-1.5),missing:stocks.filter(s=>!s.verified)};
  document.getElementById('laneList').innerHTML=`<div class="flex justify-between text-[11px] py-1"><span class="text-red-400">強勢 >1.5%</span><span>${lanes.strong.length}</span></div><div class="flex justify-between text-[11px] py-1"><span class="text-red-300">穩定 0-1.5%</span><span>${lanes.stable.length}</span></div><div class="flex justify-between text-[11px] py-1"><span class="text-zinc-400">平盤</span><span>${lanes.flat.length}</span></div><div class="flex justify-between text-[11px] py-1"><span class="text-emerald-300">弱勢</span><span>${lanes.weak.length}</span></div><div class="flex justify-between text-[11px] py-1"><span class="text-emerald-400">恐慌</span><span>${lanes.panic.length}</span></div>`;
  document.getElementById('missingList').innerHTML=lanes.missing.map(s=>`<div class="flex justify-between"><span>${s.code}</span><span class="text-zinc-500">未開盤/缺失</span></div>`).join('');
  const W=c.clientWidth,H=c.clientHeight;
  let nodes=stocks.map(s=>({ ...s, r:20+Math.sqrt(s.w||30)*5, x:W*0.5+(Math.random()-0.5)*W*0.6, y:H*0.5+(Math.random()-0.5)*H*0.6, vx:0, vy:0 }));
  for(let k=0;k<80;k++){ for(let a of nodes){ a.vx+=(W*0.5-a.x)*0.006; a.vy+=(H*0.5-a.y)*0.006; a.vx*=0.88; a.vy*=0.88; a.x+=a.vx; a.y+=a.vy; } }
  nodes.forEach(n=>{ const el=document.createElement('div'); const verified=n.verified; const col=!verified?'bg-zinc-700 border-zinc-600 text-zinc-300': n.pct>0?'bg-red-900/80 border-red-700 text-red-100': n.pct<0?'bg-emerald-900/80 border-emerald-700 text-emerald-100':'bg-zinc-800 border-zinc-700'; el.className=`bubble ${col} border`; el.style.width=n.r*2+'px'; el.style.height=n.r*2+'px'; el.style.left=(n.x-n.r)+'px'; el.style.top=(n.y-n.r)+'px'; el.innerHTML=`<span class="text-[10px]">${n.code}</span><span class="text-[10px]">${verified?(n.pct>0?'+':'')+n.pct.toFixed(2)+'%':'--'}</span>`; el.title=verified?`${n.code} ${n.name}\n現價:${n.price} 昨收:${n.prev}\n${n.pct.toFixed(2)}% 來源:${n.raw?n.raw.tlong:''}`:`${n.code}\n未開盤`; c.appendChild(el); });
}
document.getElementById('refreshBtn').onclick=load;
load();
setInterval(load,60000);
</script>
</body>
</html>
