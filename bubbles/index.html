<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股泡泡圖 v7.2 CORS突破版</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0e1a;color:#e5e5e5;font-family:ui-monospace,Menlo,monospace}.bubble{position:absolute;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;cursor:pointer;transition:transform .18s;user-select:none}.bubble:hover{transform:scale(1.08);z-index:10}</style></head><body><div class="max-w-[1280px] mx-auto p-3 md:p-4"><div class="flex flex-wrap items-center justify-between gap-2 mb-2"><div class="flex items-center gap-2 flex-wrap"><h1 class="text-[15px] md:text-[17px] font-bold">台股泡泡圖 v7.2 - CORS突破真數據版</h1><span id="sourceBadge" class="px-2 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-[10px]">來源: mis.twse.com.tw</span><span id="proxyBadge" class="px-2 py-1 rounded-full bg-amber-950 border border-amber-800 text-[10px] text-amber-300">初始化...</span><span id="timeBadge" class="px-2 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-[10px]">--:--:--</span></div><div class="flex gap-2"><button id="refreshBtn" class="px-3 py-1.5 rounded-full bg-white text-black text-[12px] font-bold">立即驗證更新</button><button id="logBtn" class="px-3 py-1.5 rounded-full bg-zinc-800 border border-zinc-700 text-[12px]">日誌</button></div></div><div id="statusLine" class="text-[11px] text-amber-300 mb-2 bg-amber-950/30 border border-amber-900/40 rounded px-2 py-1">啟動中，代理鏈自動切換，抓不到真數據會灰色保護，不顯示假漲跌</div><div class="grid grid-cols-12 gap-3"><div class="col-span-12 md:col-span-3 space-y-2"><div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-3"><div class="text-[12px] font-bold mb-2">即時分類 (真實漲跌)</div><div id="laneList" class="space-y-1"></div></div><div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-3"><div class="text-[11px] text-zinc-500 flex justify-between"><span>未開盤/資料缺失</span><span id="missingCount">30</span></div><div id="missingList" class="mt-2 text-[11px] space-y-1 max-h-[35vh] overflow-auto"></div></div></div><div class="col-span-12 md:col-span-9"><div id="bubbleContainer" class="relative w-full h-[68vh] bg-[#11131a] border border-zinc-800 rounded-xl overflow-hidden"><div id="loading" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center gap-3 z-20"><div class="h-10 w-10 rounded-full border-2 border-zinc-700 border-t-white animate-spin"></div><div id="loadingText" class="text-[12px] text-zinc-200">嘗試連線: TWSE 直連...</div><div id="batchText" class="text-[11px] text-zinc-500"></div></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-2 mt-2"><div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-2.5 flex justify-between items-center"><span class="text-[11px] text-zinc-500">數據檢核</span><span id="verifyCount" class="text-[12px] font-bold">0/30 成功</span></div><div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-2.5 flex justify-between items-center"><span class="text-[11px] text-zinc-500">延遲 / 代理</span><span id="latencyInfo" class="text-[11px]">--</span></div><div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-2.5 flex justify-between items-center"><span class="text-[11px] text-zinc-500">2330 驗證</span><span id="t2330Info" class="text-[10px] truncate max-w-[180px]">無資料 • 等待 TWSE</span></div></div></div></div><div id="logPanel" class="fixed bottom-0 left-0 right-0 max-h-[40vh] bg-black/95 border-t border-zinc-800 p-3 overflow-auto text-[11px] font-mono hidden z-50"></div></div><script>
const CORE=[{code:"2330",name:"台積電",w:100},{code:"2317",name:"鴻海",w:72},{code:"2454",name:"聯發科",w:65},{code:"2308",name:"台達電",w:58},{code:"2881",name:"富邦金",w:55},{code:"2882",name:"國泰金",w:54},{code:"2303",name:"聯電",w:48},{code:"2603",name:"長榮",w:46},{code:"1301",name:"台塑",w:42},{code:"1303",name:"南亞",w:40},{code:"2412",name:"中華電",w:52},{code:"2886",name:"兆豐金",w:44},{code:"2891",name:"中信金",w:45},{code:"2002",name:"中鋼",w:38},{code:"1216",name:"統一",w:43},{code:"2884",name:"玉山金",w:37},{code:"2885",name:"元大金",w:36},{code:"2892",name:"第一金",w:35},{code:"2382",name:"廣達",w:50},{code:"2357",name:"華碩",w:49},{code:"1101",name:"台泥",w:30},{code:"1326",name:"台化",w:32},{code:"6505",name:"台塑化",w:34},{code:"2207",name:"和泰車",w:33},{code:"3008",name:"大立光",w:60},{code:"3034",name:"聯詠",w:53},{code:"3037",name:"欣興",w:28},{code:"3045",name:"台灣大",w:39},{code:"3711",name:"日月光投控",w:47},{code:"2301",name:"光寶科",w:29}];
const PROXIES=[{id:"direct",name:"TWSE 直連",build:u=>u},{id:"corsproxy",name:"corsproxy.io",build:u=>`https://corsproxy.io/?${encodeURIComponent(u)}`},{id:"allorigins",name:"allorigins.win",build:u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`},{id:"thingproxy",name:"thingproxy.freeboard.io",build:u=>`https://thingproxy.freeboard.io/fetch/${u}`},{id:"codetabs",name:"codetabs.com",build:u=>`https://api.codetabs.com/v1/proxy?quest=${u}`}];
function chunk(a,n){let r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r;}
let stocks=CORE.map(s=>({code:s.code,name:s.name,w:s.w,price:0,prev:0,pct:0,verified:false,raw:null}));let logs=[];
function pushLog(m){const t=new Date().toLocaleTimeString('zh-TW',{hour12:false});logs.unshift(`[${t}] ${m}`);logs=logs.slice(0,200);const el=document.getElementById('logPanel');if(el)el.innerHTML=logs.map(l=>`<div>${l}</div>`).join('');}
async function fetchTO(url,ms=5000){const c=new AbortController();const id=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{signal:c.signal,cache:'no-store'});}finally{clearTimeout(id);}}
async function tryProxies(target){for(let p of PROXIES){document.getElementById('proxyBadge').textContent=`嘗試: ${p.name}`;document.getElementById('loadingText').textContent=`嘗試連線: ${p.name}...`;pushLog(`嘗試 ${p.name}`);try{const proxied=p.build(target);const start=performance.now();const res=await fetchTO(proxied,5000);const txt=await res.text();if(txt.trim().startsWith('<')&&txt.includes('html'))throw new Error('回傳HTML (CORS封鎖)');const json=JSON.parse(txt);if(!json.msgArray)throw new Error('無msgArray');const ms=Math.round(performance.now()-start);pushLog(`✅ ${p.name} 成功 ${ms}ms ${json.msgArray.length}筆`);return{json,proxy:p,ms};}catch(e){pushLog(`❌ ${p.name} 失敗: ${e.message}`);}}return null;}
async function fetchAll(){document.getElementById('loading').style.display='flex';document.getElementById('statusLine').textContent='正在連接 TWSE，代理鏈自動切換中...';const batches=chunk(CORE,10);let allRaw=[];let active=null;let total=0;for(let bi=0;bi<batches.length;bi++){const batch=batches[bi];document.getElementById('batchText').textContent=`批次 ${bi+1}/${batches.length} (${batch.map(b=>b.code).join(',')})`;const ex=batch.map(b=>`tse_${b.code}.tw`).join('|');const target=`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${ex}&json=1&_=${Date.now()}`;const r=await tryProxies(target);if(r){active=r.proxy;total+=r.ms;allRaw=allRaw.concat(r.json.msgArray);}await new Promise(r=>setTimeout(r,350));}if(allRaw.length===0){document.getElementById('statusLine').textContent='⚠️ TWSE 直連失敗，已切換至保護模式（不顯示假漲跌）- 請按 立即驗證更新 重試';document.getElementById('proxyBadge').textContent='⚠️ 模擬資料(連線保護)';document.getElementById('loading').style.display='none';render();return;}let success=0;allRaw.forEach(raw=>{const code=raw.c;const idx=stocks.findIndex(s=>s.code===code);if(idx<0)return;const z=raw.z==='-'||raw.z==='' ? null : parseFloat(raw.z);const y=raw.y?parseFloat(raw.y):null;if(z!=null&&y!=null&&y!==0){const pct=((z-y)/y)*100;stocks[idx].price=z;stocks[idx].prev=y;stocks[idx].pct=pct;stocks[idx].verified=true;stocks[idx].raw=raw;success++;}});document.getElementById('verifyCount').textContent=`${success}/30 成功`;document.getElementById('latencyInfo').textContent=`延遲 ${total}ms • ${active?active.name:'--'} ${success>0?'• ✅已驗證':''}`;document.getElementById('sourceBadge').textContent=`來源: mis.twse.com.tw via ${active?active.name:'direct'}`;document.getElementById('timeBadge').textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false});document.getElementById('proxyBadge').textContent=`✅ ${active?active.name:'直連'} 已驗證`;document.getElementById('proxyBadge').className='px-2 py-1 rounded-full bg-emerald-950 border border-emerald-800 text-[10px] text-emerald-300';document.getElementById('statusLine').textContent=`✅ TWSE 真實數據已驗證 via ${active.name} | 最後更新: ${new Date().toLocaleString('zh-TW')} | (z-y)/y 自我檢核`;document.getElementById('loading').style.display='none';const t2330=stocks.find(s=>s.code==='2330');if(t2330&&t2330.verified)document.getElementById('t2330Info').textContent=`現價 ${t2330.price.toFixed(2)} vs 昨收 ${t2330.prev.toFixed(2)} = ${(t2330.pct>0?'+':'')+t2330.pct.toFixed(2)}% 吻合`;render();}
function render(){const c=document.getElementById('bubbleContainer');c.querySelectorAll('.bubble').forEach(e=>e.remove());const lanes={strong:stocks.filter(s=>s.verified&&s.pct>1.5),stable:stocks.filter(s=>s.verified&&s.pct>0&&s.pct<=1.5),flat:stocks.filter(s=>s.verified&&Math.abs(s.pct)<0.05),weak:stocks.filter(s=>s.verified&&s.pct<0&&s.pct>=-1.5),panic:stocks.filter(s=>s.verified&&s.pct<-1.5),missing:stocks.filter(s=>!s.verified)};document.getElementById('laneList').innerHTML=`<div class="flex justify-between text-[11px] py-1"><span class="text-red-400">強勢領漲 >1.5%</span><span>${lanes.strong.length}</span></div><div class="flex justify-between text-[11px] py-1"><span class="text-red-300">穩定上揚 0~1.5%</span><span>${lanes.stable.length}</span></div><div class="flex justify-between text-[11px] py-1"><span class="text-zinc-400">平盤震盪</span><span>${lanes.flat.length}</span></div><div class="flex justify-between text-[11px] py-1"><span class="text-emerald-300">弱勢回檔</span><span>${lanes.weak.length}</span></div><div class="flex justify-between text-[11px] py-1"><span class="text-emerald-400">恐慌區</span><span>${lanes.panic.length}</span></div>`;document.getElementById('missingCount').textContent=lanes.missing.length;document.getElementById('missingList').innerHTML=lanes.missing.map(s=>`<div class="flex justify-between"><span>${s.code} ${s.name}</span><span class="text-zinc-500">未開盤/缺失</span></div>`).join('');const W=c.clientWidth,H=c.clientHeight;let nodes=stocks.map((s,i)=>({ ...s, r:20+Math.sqrt(s.w)*5.5, x:W*0.5+(Math.random()-0.5)*W*0.65, y:H*0.5+(Math.random()-0.5)*H*0.65, vx:0, vy:0 }));for(let k=0;k<90;k++){ for(let a of nodes){ a.vx+=(W*0.5-a.x)*0.006; a.vy+=(H*0.5-a.y)*0.006; a.vx*=0.88; a.vy*=0.88; a.x+=a.vx; a.y+=a.vy; } }nodes.forEach(n=>{const el=document.createElement('div');const verified=n.verified;const col=!verified?'bg-zinc-700 border-zinc-600 text-zinc-300': n.pct>0?'bg-red-900/80 border-red-700 text-red-100': n.pct<0?'bg-emerald-900/80 border-emerald-700 text-emerald-100':'bg-zinc-800 border-zinc-700 text-zinc-200';el.className=`bubble ${col} border`;el.style.width=n.r*2+'px';el.style.height=n.r*2+'px';el.style.left=(n.x-n.r)+'px';el.style.top=(n.y-n.r)+'px';el.innerHTML=`<span class="text-[10px]">${n.code}</span><span class="text-[10px]">${verified?(n.pct>0?'+':'')+n.pct.toFixed(2)+'%':'--'}</span>`;el.title=verified?`${n.code} ${n.name}\n現價:${n.price} 昨收:${n.prev}\n漲跌:${n.pct.toFixed(2)}%\n來源:${n.raw?n.raw.tlong:''}\n驗證:(z-y)/y 計算`:`${n.code} ${n.name}\n未開盤/資料缺失\n保護模式`;let dx=(Math.random()-0.5)*0.12, dy=(Math.random()-0.5)*0.12;setInterval(()=>{ if(Math.random()<0.04){ n.x+=dx; n.y+=dy; el.style.left=(n.x-n.r)+'px'; el.style.top=(n.y-n.r)+'px'; }},200);c.appendChild(el);});}
document.getElementById('refreshBtn').onclick=fetchAll;document.getElementById('logBtn').onclick=()=>{document.getElementById('logPanel').classList.toggle('hidden');};fetchAll();setInterval(fetchAll,60000);
</script></body></html>
